<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Ultra Cloud — Multi-Cloud File Manager</title>
    <meta name="description" content="Ultra Cloud — browser-based multi-cloud storage manager. Manage files across AWS S3, Azure Blob, GCP Cloud Storage, and Backblaze B2." />

    <script type="module" src="/src/main.jsx"></script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
